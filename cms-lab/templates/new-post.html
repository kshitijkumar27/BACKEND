<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Post - Simple CMS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>


<body>

<div class="container">

    <header>

        <div>
            <h1>Create Post</h1>
            <p class="subtitle">
                Add a new article to Simple CMS
            </p>
        </div>

        <a href="{{ url_for('posts') }}"
           class="secondary-button">
            ← All Posts
        </a>

    </header>


    <div class="form-card">

        <form action="{{ url_for('create_post') }}"
              method="POST">


            <div class="form-group">

                <label for="title">
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter post title"
                    required
                >

            </div>


            <div class="form-group">

                <label for="author">
                    Author
                </label>

                <input
                    type="text"
                    id="author"
                    name="author"
                    placeholder="Enter author name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="content">
                    Content
                </label>

                <textarea
                    id="content"
                    name="content"
                    rows="10"
                    placeholder="Write your post..."
                    required
                ></textarea>

            </div>


            <button type="submit"
                    class="button submit-button">
                Publish Post
            </button>


        </form>

    </div>

</div>

</body>
</html>
