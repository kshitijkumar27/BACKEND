<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ post['title'] }} - Simple CMS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">

    <a href="{{ url_for('posts') }}"
       class="back-link">
        ← Back to all posts
    </a>


    <article class="full-post">

        <h1>
            {{ post['title'] }}
        </h1>


        <div class="post-info">

            <span>
                By {{ post['author'] }}
            </span>

            <span>
                {{ post['createdAt'].strftime('%d %B %Y, %I:%M %p') }}
            </span>

        </div>


        <div class="post-content">

            {{ post['content'] }}

        </div>

    </article>

</div>

</body>
</html>
